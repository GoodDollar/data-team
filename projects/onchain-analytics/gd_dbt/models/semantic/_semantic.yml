version: 2

models:
  - name: claim_events
    description: >
      **What this is:** The single source of truth for all UBI claims. Every dashboard,
      metric, or analysis that involves claiming reads from this model — never from raw data directly.


      **Business context:** Each row is one person collecting their daily G$ UBI.
      Use this to answer: "How many claims happened on date X?", "How much G$ was distributed?",
      "Which wallets are actively claiming?"


      **Technical:** Reads staging (claim_contract_events) and joins the `tokens` seed to resolve
      the decimal factor for the GoodDollar token on that chain. Grain: one row per claim event
      (tx_hash + log_index).


      **Why the decimal factor is a join and not a constant:** GoodDollar is an 18-decimal token on
      Celo and XDC and a 2-decimal token on Fuse and Ethereum. This model previously inherited a
      hardcoded division by 100, which inflated every GD figure on XDC by 1e16. The factor now comes
      from the `tokens` seed, where every value was measured against the deployed contract.
    config:
      tags: ['claim']
    columns:
      - name: network
        description: "Which blockchain (XDC, CELO, or ETHEREUM)."
        tests:
          - not_null
      - name: chain_id
        description: "Numeric blockchain identifier."
      - name: block_number
        description: "Block number on the blockchain."
      - name: block_timestamp
        description: "When this claim happened. The basis for all daily/weekly/monthly aggregations."
        tests:
          - not_null
      - name: tx_hash
        description: "Unique transaction ID on the blockchain."
        tests:
          - not_null
      - name: log_index
        description: "Position within transaction (technical dedup key)."
        tests:
          - not_null
      - name: contract_address
        description: "Address of the UBI claim contract."
      - name: claimer_address
        description: >
          The whitelisted identity entitled to this claim. **Not necessarily the wallet that
          received the tokens.** The UBIScheme contract emits the identity root and transfers to
          `msg.sender`, so a connected wallet receives the GD while the root appears here. Measured
          at 1.19 percent divergence on Celo. Use this column to count people, not payments.
        tests:
          - not_null
      - name: token_address
        description: "The GoodDollar token contract on this chain, resolved from the tokens seed."
      - name: token_symbol
        description: "Warehouse ticker for the token, from the tokens seed."
      - name: token_decimals
        description: "The decimal factor applied to produce claim_amount. Measured, not assumed."
      - name: token_decimals_source
        description: >
          How the decimal factor was established. Carried through so a reader can see the evidence
          rather than inherit it invisibly.
      - name: claim_amount_raw
        description: "Exact uint256 as emitted onchain, as a string. The ground truth."
      - name: claim_amount
        description: >
          GD claimed, human readable. Equals claim_amount_raw divided by 10^token_decimals.
          Replaces the former `amount_g`, which was wrong by 1e16 on XDC.
        tests:
          - not_null
      - name: ingested_at
        description: "When our pipeline captured this event."

  - name: claimer_activity
    description: >
      **What this is:** A summary of each claimer's activity — one row per person per network.
      Shows when they first claimed, when they last claimed, how many times, and how much total.


      **Business context:** Use this to answer: "How many active claimers do we have?",
      "What's the retention pattern?", "Who are the power users?", "How many people
      claimed only once and never came back?"


      **Technical:** Aggregates claim_events by (claimer_address, network). Materialized as a
      view — always fresh, recalculated on every query. No historical snapshots; shows
      current cumulative state.
    config:
      tags: ['claim']
    columns:
      - name: claimer_address
        description: "The wallet address. One row per wallet per network."
        tests:
          - not_null
      - name: network
        description: "Which blockchain this activity is on."
        tests:
          - not_null
      - name: chain_id
        description: "Numeric blockchain identifier."
      - name: first_claim_timestamp
        description: "When this person first ever claimed on this network. Useful for cohort analysis."
      - name: latest_claim_timestamp
        description: "When this person most recently claimed. Stale = inactive user."
      - name: total_claims
        description: "Total number of times this person has claimed on this network."
      - name: claim_amount_total
        description: >
          Lifetime GD earned by this identity on this network. Renamed from `total_amount_g`, whose
          values were inflated by 1e16 before the decimals fix.
      - name: active_days
        description: "Number of distinct days this person claimed. Measures engagement consistency."

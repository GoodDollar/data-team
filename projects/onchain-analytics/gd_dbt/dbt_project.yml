name: 'gd_dbt'
version: '1.0.0'
config-version: 2

# This tells dbt which connection profile to use (must match the name in ~/.dbt/profiles.yml)
profile: 'gd_dbt'

# Paths (relative to this file)
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

# These folders are generated by dbt at run time — never commit them
clean-targets:
  - "target"
  - "dbt_packages"

# Reference data loaded from CSV. Lives in Semantic so it sits alongside the models
# that join it rather than in a fourth dataset nobody thinks to look in.
#
# Column types are declared rather than inferred wherever an inferred type would be wrong or
# fragile. Block numbers use the int64 maximum as the "still current" sentinel, which a type
# inferrer can render as a float and silently round; era indexes are counts, not measures.
seeds:
  gd_dbt:
    +schema: Semantic
    +quote_columns: true
    tokens:
      +column_types:
        decimals: INT64
        is_gd: BOOLEAN
    contract_deployments:
      +column_types:
        chain_id: INT64
        era_index: INT64
        era_count: INT64
        valid_from_block: INT64
        valid_to_block: INT64
        creation_block: INT64
        is_live: BOOLEAN

# Default materialization per layer.
# "view" = BigQuery view (no data stored, always fresh)
# "table" = BigQuery table (data is stored, must be rebuilt to update)
models:
  gd_dbt:
    staging:
      +materialized: view
      +schema: Staging
      +tags: ['staging']
    semantic:
      +materialized: view
      +schema: Semantic
      +tags: ['semantic']
    marts:
      +materialized: table
      +schema: Marts
      +tags: ['mart']
